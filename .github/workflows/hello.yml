name: Premier workflow CI

on:
  push:
  workflow_dispatch:

jobs:
  hello:
    runs-on: ubuntu-latest

    steps:
      - name: Afficher un message
        run: echo "Hello from GitHub Actions"

      - name: Etape en erreur
        run: |
          echo "Cette etape va echouer"
          exit 1

      - name: Informations sur l'environnement
        run: |
          echo "Version de Python :"
          python3 --version
          echo "Repertoire courant :"
          pwd
          echo "Liste des fichiers :"
          ls -la

      - name: Informations Git
        run: |
          echo "Branche : $GITHUB_REF_NAME"
          echo "Commit : $GITHUB_SHA"
          echo "Evenement : $GITHUB_EVENT_NAME"
